<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Задачи проектов v4.1</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      /* Базовые цвета с фолбэком на светлую тему */
      --bg: var(--tg-theme-bg-color, #f4f4f5);
      --card: var(--tg-theme-secondary-bg-color, #ffffff);
      --text: var(--tg-theme-text-color, #18181b);
      --hint: var(--tg-theme-hint-color, #71717a);
      --btn: var(--tg-theme-button-color, #2563eb);
      --btn-text: var(--tg-theme-button-text-color, #ffffff);
      --input-bg: var(--tg-theme-bg-color, #ffffff);
      --input-border: rgba(0, 0, 0, 0.12);
      --bar-bg: rgba(0, 0, 0, 0.04);
      --border-color: rgba(0, 0, 0, 0.08);

      /* Статусы для светлой темы */
      --active-border: #22c55e;
      --active-bg: rgba(34, 197, 94, 0.08);
      --active-timer: #15803d;

      --paused-border: #eab308;
      --paused-bg: rgba(234, 179, 8, 0.1);
      --paused-timer: #b45309;

      --expired-border: #ef4444;
      --expired-bg: rgba(239, 68, 68, 0.1);
      --expired-timer: #dc2626;

      --completed-border: #71717a;
      --completed-bg: rgba(113, 113, 122, 0.06);
      --completed-timer: var(--hint);
    }

    /* Адаптация под темную тему Telegram */
    @media (prefers-color-scheme: dark) {
      :root {
        --input-border: rgba(255, 255, 255, 0.15);
        --bar-bg: rgba(255, 255, 255, 0.06);
        --border-color: rgba(255, 255, 255, 0.1);

        --active-bg: rgba(34, 197, 94, 0.15);
        --active-timer: #4ade80;

        --paused-bg: rgba(234, 179, 8, 0.15);
        --paused-timer: #facc15;

        --expired-bg: rgba(239, 68, 68, 0.15);
        --expired-timer: #f87171;
      }
    }

    body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    .header { margin-bottom: 12px; }
    h1 { font-size: 20px; margin: 0 0 4px 0; color: var(--text); }
    
    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(37, 99, 235, 0.15);
      color: var(--btn);
      margin-top: 4px;
    }

    .notice-box {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.3);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .notice-box a {
      background: #eab308;
      color: #000;
      padding: 5px 10px;
      border-radius: 6px;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      margin-left: 8px;
      cursor: pointer;
    }

    .card {
      background: var(--card);
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
    }

    .settings-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--bar-bg);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      color: var(--text);
      border: 1px solid var(--border-color);
    }
    .settings-bar label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    label {
      font-size: 13px;
      color: var(--hint);
      display: block;
      margin-top: 8px;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--input-border);
      box-sizing: border-box;
      font-size: 15px;
      background: var(--input-bg);
      color: var(--text);
      outline: none;
    }
    input:focus, select:focus {
      border-color: var(--btn);
    }

    button.btn-primary {
      background: var(--btn);
      color: var(--btn-text);
      border: none;
      font-weight: 600;
      cursor: pointer;
      margin-top: 4px;
    }

    .task-item {
      background: var(--card);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      border: 1px solid var(--border-color);
      border-left: 6px solid var(--hint);
      transition: background 0.2s ease, border-color 0.2s ease;
    }
    .task-item.status-active { border-left-color: var(--active-border); background: var(--active-bg); }
    .task-item.status-paused { border-left-color: var(--paused-border); background: var(--paused-bg); }
    .task-item.status-expired { border-left-color: var(--expired-border); background: var(--expired-bg); }
    .task-item.status-completed { border-left-color: var(--completed-border); background: var(--completed-bg); opacity: 0.7; }

    .task-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .task-title { font-weight: 600; font-size: 16px; margin-bottom: 4px; color: var(--text); }
    .task-project-tag {
      font-size: 11px;
      color: var(--btn);
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    .task-timer {
      font-family: monospace;
      font-size: 14px;
      font-weight: bold;
      margin-top: 4px;
    }
    .status-active .task-timer { color: var(--active-timer); }
    .status-paused .task-timer { color: var(--paused-timer); }
    .status-expired .task-timer { color: var(--expired-timer); }
    .status-completed .task-timer { color: var(--completed-timer); text-decoration: line-through; }

    .task-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-icon {
      background: var(--card);
      border: 1px solid var(--input-border);
      color: var(--text);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-icon.complete { color: #22c55e; border-color: rgba(34, 197, 94, 0.4); }
    .btn-icon.delete { color: #ef4444; border-color: rgba(239, 68, 68, 0.4); }

    .task-share-link {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--hint);
      word-break: break-all;
    }
    .copy-chip {
      background: var(--bar-bg);
      color: var(--text);
      border: 1px solid var(--border-color);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📋 Задачи и дедлайны <span style="font-size: 11px; color: var(--hint); font-weight: normal;">(v4.1)</span></h1>
    <span id="roleBadge" class="badge">Загрузка...</span>
  </div>

  <div id="startBotNotice" class="notice-box" style="display: none;">
    <span>Включите уведомления, чтобы бот мог присылать вам статус задач</span>
    <a id="botStartBtn" onclick="enableNotifications()">Включить</a>
  </div>

  <div id="adminSettingsPanel" class="settings-bar" style="display: none;">
    <span id="settingsTargetProjectLabel">Разрешить клиентам ставить задачи:</span>
    <label>
      <input type="checkbox" id="allowClientCreateToggle" onchange="toggleClientPermissions(this.checked)" style="width: 18px; height: 18px; margin: 0;">
      <b id="permissionText">Выкл</b>
    </label>
  </div>

  <div class="card" id="createTaskCard">
    <div id="adminProjectSelect" style="display: none;">
      <label><b>ID проекта (комната):</b></label>
      <input type="text" id="projectInput" placeholder="Например: katya" oninput="onAdminProjectInputChange()">
    </div>

    <label>Название задачи</label>
    <input type="text" id="taskTitle" placeholder="Например: Согласование прототипа">
    
    <label>Дедлайн</label>
    <input type="datetime-local" id="taskDeadline">

    <button class="btn-primary" onclick="addTask()">Добавить задачу</button>
  </div>

  <div id="filterContainer" style="display: none; margin-bottom: 12px;">
    <label style="font-size: 12px; color: var(--hint);">Фильтр по проекту:</label>
    <select id="projectFilter" onchange="filterTasks()">
      <option value="ALL">Все проекты</option>
    </select>
  </div>

  <div id="taskList"></div>

  <script>
    const ADMIN_TELEGRAM_ID = 487609648;
    const BOT_TOKEN = '8948920326:AAE0jFBqpVvegW1pi-UoVds89f5CTHzR4to';
    const BOT_USERNAME = 'my_timer_tasks_bot';
    const APP_SHORT_NAME = 'app';

    // Вставьте ваши параметры конфигурации Firebase:
    const firebaseConfig = {
      apiKey: "AIzaSyCUWPTvlHldC20LL-UQVMM7RAuidQyiNlY",
  authDomain: "telegram-timer-tasks-fdfa9.firebaseapp.com",
  databaseURL: "https://telegram-timer-tasks-fdfa9-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "telegram-timer-tasks-fdfa9",
  storageBucket: "telegram-timer-tasks-fdfa9.firebasestorage.app",
  messagingSenderId: "378662190866",
  appId: "1:378662190866:web:9cf67c57c37bc1cbaf7dcb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    function normalizeRoom(name) {
      if (!name) return '';
      return String(name).trim().toLowerCase().replace(/[.#$\[\]]/g, '_');
    }

    function getExplicitRoomFromUrl() {
      let raw = null;
      if (tg?.initDataUnsafe?.start_param) raw = tg.initDataUnsafe.start_param;
      if (!raw && tg?.initData) {
        try {
          const params = new URLSearchParams(tg.initData);
          if (params.get('start_param')) raw = params.get('start_param');
        } catch (e) {}
      }
      if (!raw) {
        const urlParams = new URLSearchParams(window.location.search);
        raw = urlParams.get('startapp') || urlParams.get('room') || urlParams.get('start_param');
      }
      if (!raw && window.location.hash) {
        const hashMatch = window.location.hash.match(/tgWebAppStartParam=([^&]+)/);
        if (hashMatch && hashMatch[1]) raw = decodeURIComponent(hashMatch[1]);
      }
      return normalizeRoom(raw);
    }

    const currentUserId = tg?.initDataUnsafe?.user?.id ? Number(tg.initDataUnsafe.user.id) : null;
    const currentUserName = tg?.initDataUnsafe?.user?.first_name || 'Участник';
    const isAdmin = (Number(currentUserId) === Number(ADMIN_TELEGRAM_ID));

    let currentRoom = getExplicitRoomFromUrl();

    if (!currentRoom && !isAdmin) {
      currentRoom = localStorage.getItem('last_project_room') || '';
    }

    const roleBadge = document.getElementById('roleBadge');

    function updateHeaderUI() {
      if (isAdmin) {
        roleBadge.textContent = '👑 Режим Администратора';
        document.getElementById('adminProjectSelect').style.display = 'block';
        document.getElementById('adminSettingsPanel').style.display = 'flex';
        document.getElementById('filterContainer').style.display = 'block';
        if (!document.getElementById('projectInput').value) {
          document.getElementById('projectInput').value = (currentRoom && currentRoom !== 'general') ? currentRoom : 'katya';
        }
      } else {
        roleBadge.textContent = `📁 Проект: ${currentRoom || 'Загрузка...'}`;
      }
    }

    updateHeaderUI();

    let allTasks = [];
    const notifiedExpiredTasks = new Set();

    function getAdminConfiguringRoom() {
      const inputEl = document.getElementById('projectInput');
      const val = inputEl ? normalizeRoom(inputEl.value) : '';
      return val || normalizeRoom(currentRoom) || 'katya';
    }

    async function resolveUserProject() {
      if (!currentUserId) return;

      if (currentRoom) {
        localStorage.setItem('last_project_room', currentRoom);
        db.ref(`project_members/${currentRoom}/${currentUserId}`).update({
          user_id: currentUserId,
          user_name: currentUserName,
          updated_at: Date.now()
        });
      } else if (!isAdmin) {
        const snapshot = await db.ref('project_members').once('value');
        const membersData = snapshot.val() || {};
        for (const [rName, users] of Object.entries(membersData)) {
          if (users && users[currentUserId]) {
            currentRoom = normalizeRoom(rName);
            localStorage.setItem('last_project_room', currentRoom);
            break;
          }
        }
        if (!currentRoom) currentRoom = 'general';
        updateHeaderUI();
      }

      if (!isAdmin) {
        db.ref(`project_members/${currentRoom}/${currentUserId}/notifications_enabled`).on('value', (snap) => {
          if (snap.val()) {
            document.getElementById('startBotNotice').style.display = 'none';
          } else {
            document.getElementById('startBotNotice').style.display = 'flex';
          }
        });
      }
    }

    async function enableNotifications() {
      document.getElementById('startBotNotice').style.display = 'none';
      if (currentUserId && currentRoom) {
        db.ref(`project_members/${currentRoom}/${currentUserId}`).update({
          notifications_enabled: true
        });
      }
      if (tg?.openTelegramLink) {
        tg.openTelegramLink(`https://t.me/${BOT_USERNAME}?start=${currentRoom}`);
      } else {
        window.open(`https://t.me/${BOT_USERNAME}?start=${currentRoom}`, '_blank');
      }
    }

    function checkPermissions() {
      const targetRoom = isAdmin ? getAdminConfiguringRoom() : currentRoom;
      if (!targetRoom) return;

      db.ref(`project_settings/${targetRoom}/allow_client_create`).on('value', (snap) => {
        const allowCreate = !!snap.val();
        if (isAdmin) {
          document.getElementById('settingsTargetProjectLabel').textContent = `Клиентам проекта [${targetRoom}] разрешено ставить задачи:`;
          document.getElementById('allowClientCreateToggle').checked = allowCreate;
          document.getElementById('permissionText').textContent = allowCreate ? 'Вкл' : 'Выкл';
        } else {
          document.getElementById('createTaskCard').style.display = allowCreate ? 'block' : 'none';
        }
      });
    }

    async function toggleClientPermissions(enabled) {
      if (!isAdmin) return;
      const targetRoom = getAdminConfiguringRoom();
      document.getElementById('permissionText').textContent = enabled ? 'Вкл' : 'Выкл';
      await db.ref(`project_settings/${targetRoom}`).update({
        allow_client_create: enabled
      });
    }

    let typingTimer;
    function onAdminProjectInputChange() {
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        checkPermissions();
      }, 400);
    }

    async function sendPushNotification(targetRoom, messageText) {
      try {
        const normRoom = normalizeRoom(targetRoom);
        const snapshot = await db.ref(`project_members/${normRoom}`).once('value');
        const members = snapshot.val() || {};

        const idSet = new Set();
        Object.keys(members).forEach(uid => idSet.add(Number(uid)));
        idSet.add(ADMIN_TELEGRAM_ID);

        const recipientIds = Array.from(idSet).filter(id => !isNaN(id) && id > 0);

        await fetch('/api/notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            botToken: BOT_TOKEN,
            userIds: recipientIds,
            message: messageText
          })
        });
      } catch (e) {
        console.error('Ошибка отправки уведомления:', e);
      }
    }

    function initRealtimeTasks() {
      db.ref('group_tasks').on('value', (snapshot) => {
        const val = snapshot.val() || {};
        const parsed = Object.keys(val).map(key => ({
          id: key,
          ...val[key]
        }));
        parsed.sort((a, b) => b.created_at - a.created_at);

        allTasks = parsed;
        if (isAdmin) updateFilterDropdown();
        renderTasks();
      });
    }

    function updateFilterDropdown() {
      const select = document.getElementById('projectFilter');
      const currentSelected = select.value;
      const projects = Array.from(new Set(allTasks.map(t => normalizeRoom(t.chat_id))));
      select.innerHTML = '<option value="ALL">Все проекты</option>' + 
        projects.map(p => `<option value="${p}">${p}</option>`).join('');
      if (projects.includes(currentSelected)) select.value = currentSelected;
    }

    function filterTasks() {
      const filterVal = document.getElementById('projectFilter').value;
      if (isAdmin && filterVal !== 'ALL') {
        document.getElementById('projectInput').value = filterVal;
        checkPermissions();
      }
      renderTasks();
    }

    async function addTask() {
      const titleEl = document.getElementById('taskTitle');
      const deadlineEl = document.getElementById('taskDeadline');
      const projectInput = document.getElementById('projectInput');

      if (!titleEl.value.trim() || !deadlineEl.value) {
        alert('Заполните название и дедлайн');
        return;
      }

      let rawTarget = currentRoom;
      if (isAdmin) {
        rawTarget = projectInput.value.trim() || 'katya';
      }
      const targetRoom = normalizeRoom(rawTarget);

      const newTask = {
        chat_id: targetRoom,
        title: titleEl.value.trim(),
        deadline: new Date(deadlineEl.value).getTime(),
        is_paused: false,
        is_completed: false,
        remaining_ms: null,
        created_at: Date.now()
      };

      const newRef = db.ref('group_tasks').push();
      await newRef.set(newTask);

      sendPushNotification(targetRoom, `⚡ <b>Новая задача!</b>\nПроект: <code>${targetRoom}</code>\nЗадача: <b>${newTask.title}</b>\nАвтор: ${currentUserName}`);

      titleEl.value = '';
      deadlineEl.value = '';
    }

    async function togglePause(id) {
      if (!isAdmin) return;
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      const now = Date.now();
      let updateData = {};
      const targetRoom = normalizeRoom(task.chat_id);

      if (task.is_paused) {
        const remaining = task.remaining_ms || 0;
        updateData = { is_paused: false, deadline: now + remaining, remaining_ms: null };
        sendPushNotification(targetRoom, `▶ <b>Задача возобновлена:</b> "${task.title}" (Проект: ${targetRoom})`);
      } else {
        const remaining = Math.max(0, task.deadline - now);
        updateData = { is_paused: true, remaining_ms: remaining };
        sendPushNotification(targetRoom, `⏸ <b>Задача на паузе:</b> "${task.title}" (Проект: ${targetRoom})`);
      }

      await db.ref(`group_tasks/${id}`).update(updateData);
    }

    async function toggleComplete(id) {
      if (!isAdmin) return;
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      const targetRoom = normalizeRoom(task.chat_id);
      const newStatus = !task.is_completed;
      
      await db.ref(`group_tasks/${id}`).update({ is_completed: newStatus });
      if (newStatus) {
        sendPushNotification(targetRoom, `✅ <b>Задача выполнена!</b>\nПроект: <code>${targetRoom}</code>\nЗадача: <b>${task.title}</b>`);
      }
    }

    async function deleteTask(id) {
      if (!isAdmin) return;
      const task = allTasks.find(t => t.id === id);
      if (!task) return;

      const targetRoom = normalizeRoom(task.chat_id);
      const taskTitle = task.title;

      await db.ref(`group_tasks/${id}`).remove();
      sendPushNotification(targetRoom, `🗑 <b>Задача удалена:</b>\nПроект: <code>${targetRoom}</code>\nЗадача: <b>${taskTitle}</b>`);
    }

    function formatTime(ms) {
      if (ms <= 0) return "Дедлайн истек";
      const totalSec = Math.floor(ms / 1000);
      const d = Math.floor(totalSec / 86400);
      const h = Math.floor((totalSec % 86400) / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      let str = "";
      if (d > 0) str += `${d}д `;
      return str + `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function copyLink(text, chipEl) {
      navigator.clipboard.writeText(text).then(() => {
        const orig = chipEl.textContent;
        chipEl.textContent = 'Скопировано!';
        chipEl.style.background = '#22c55e';
        chipEl.style.color = '#fff';
        setTimeout(() => {
          chipEl.textContent = orig;
          chipEl.style.background = '';
          chipEl.style.color = '';
        }, 1500);
      });
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const filterVal = document.getElementById('projectFilter').value;
      const now = Date.now();

      let displayList = allTasks;
      if (!isAdmin) {
        displayList = allTasks.filter(t => normalizeRoom(t.chat_id) === (currentRoom || 'none'));
      } else if (filterVal !== 'ALL') {
        displayList = allTasks.filter(t => normalizeRoom(t.chat_id) === filterVal);
      }

      if (displayList.length === 0) {
        list.innerHTML = '<p style="text-align:center; color: var(--hint); padding: 15px;">Задач пока нет</p>';
        return;
      }

      list.innerHTML = displayList.map(t => {
        let statusClass = "status-active";
        let timerText = "";
        const roomName = normalizeRoom(t.chat_id);

        if (t.is_completed) {
          statusClass = "status-completed";
          timerText = "✓ Выполнено";
        } else if (t.is_paused) {
          statusClass = "status-paused";
          timerText = `⏸ На паузе (${formatTime(t.remaining_ms || 0)})`;
        } else {
          const diff = t.deadline - now;
          if (diff <= 0) {
            statusClass = "status-expired";
            timerText = "Срок истек!";
          } else {
            statusClass = "status-active";
            timerText = formatTime(diff);
          }
        }

        const projectLink = `https://t.me/${BOT_USERNAME}/${APP_SHORT_NAME}?startapp=${encodeURIComponent(roomName)}`;

        return `
          <div class="task-item ${statusClass}" id="card-${t.id}">
            <div class="task-header-row">
              <div>
                ${isAdmin ? `<div class="task-project-tag">📁 ${roomName}</div>` : ''}
                <div class="task-title">${t.title}</div>
                <div class="task-timer" id="t-${t.id}">${timerText}</div>
              </div>

              ${isAdmin ? `
                <div class="task-actions">
                  <button class="btn-icon complete" title="Выполнено" onclick="toggleComplete('${t.id}')">✓</button>
                  ${!t.is_completed ? `
                    <button class="btn-icon" title="${t.is_paused ? 'Возобновить' : 'Пауза'}" onclick="togglePause('${t.id}')">
                      ${t.is_paused ? '▶' : '⏸'}
                    </button>
                  ` : ''}
                  <button class="btn-icon delete" title="Удалить" onclick="deleteTask('${t.id}')">✕</button>
                </div>
              ` : ''}
            </div>

            ${isAdmin ? `
              <div class="task-share-link">
                <span>🔗 Ссылка: ${projectLink}</span>
                <span class="copy-chip" onclick="copyLink('${projectLink}', this)">Скопировать</span>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    setInterval(() => {
      const now = Date.now();
      allTasks.forEach(t => {
        if (t.is_paused || t.is_completed) return;
        const el = document.getElementById(`t-${t.id}`);
        const card = document.getElementById(`card-${t.id}`);
        if (!el || !card) return;

        const diff = t.deadline - now;
        if (diff <= 0) {
          el.textContent = "Срок истек!";
          card.className = "task-item status-expired";

          if (!notifiedExpiredTasks.has(t.id)) {
            notifiedExpiredTasks.add(t.id);
            const targetRoom = normalizeRoom(t.chat_id);
            sendPushNotification(targetRoom, `🚨 <b>Внимание! Истек срок задачи:</b>\nПроект: <code>${targetRoom}</code>\nЗадача: <b>${t.title}</b>`);
          }
        } else {
          el.textContent = formatTime(diff);
        }
      });
    }, 1000);

    resolveUserProject().then(() => {
      checkPermissions();
      initRealtimeTasks();
    });
  </script>
</body>
</html>
